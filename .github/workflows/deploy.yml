name: Greenfield Supabase Migration

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Maak het wachtwoord URL-veilig met quote_plus
      - name: Encode Database Password
        id: encode_pwd
        run: |
          ENCODED_PASSWORD=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote_plus(sys.stdin.read().strip()))" << 'EOF'
          ${{ secrets.NEW_DB_PASSWORD }}
          EOF
          )
          echo "PASSWORD=$ENCODED_PASSWORD" >> $GITHUB_OUTPUT

      - name: Setup SSH Tunnel to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # GEBRUIK JOUW UNIEKE COOLIFY CONTAINERNAAM:
          # We sturen de tunnel direct door naar jouw specifieke database-container
          ssh -o StrictHostKeyChecking=no -f -N -L 54322:db-gbzn02wrcuunfjli9jsqmt9o:5432 admin@${{ secrets.VPS_IP }}

      - name: Run Supabase Migrations
        run: |
          # De Supabase CLI voert nu de Greenfield-migratie uit via de perfect afgestelde tunnel
          supabase db push --db-url "postgresql://postgres:${{ steps.encode_pwd.outputs.PASSWORD }}@127.0.0.1:54322/postgres?sslmode=disable"
