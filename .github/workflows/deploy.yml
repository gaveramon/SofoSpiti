name: Greenfield Supabase Migration

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # NIEUWE STAP: Codeer het wachtwoord met speciale tekens naar een veilige URL-string
      - name: Encode Database Password
        id: encode_pwd
        run: |
          ENCODED_PASSWORD=$(python3 -c "import urllib.parse; print(urllib.parse.quote_making_safe('', safe=''))" << 'EOF'
          ${{ secrets.NEW_DB_PASSWORD }}
          EOF
          )
          # Sla het gecodeerde wachtwoord op in de GitHub Actions omgevingsvariabelen
          echo "PASSWORD=$ENCODED_PASSWORD" >> $GITHUB_OUTPUT

      - name: Setup SSH Tunnel to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # Open de tunnel over IPv4 naar localhost
          ssh -4 -o StrictHostKeyChecking=no -f -N -L 54322:localhost:5432 admin@${{ secrets.VPS_IP }}

      - name: Run Supabase Migrations
        run: |
          # We gebruiken hier het gecodeerde wachtwoord uit de 'encode_pwd' stap
          supabase db push --db-url "postgresql://postgres:${{ steps.encode_pwd.outputs.PASSWORD }}@127.0.0.1:54322/postgres"
