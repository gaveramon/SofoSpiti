name: Greenfield Supabase Migration

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Maak het wachtwoord URL-veilig met quote_plus
      - name: Encode Database Password
        id: encode_pwd
        run: |
          ENCODED_PASSWORD=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote_plus(sys.stdin.read().strip()))" << 'EOF'
          ${{ secrets.NEW_DB_PASSWORD }}
          EOF
          )
          # Sla het gecodeerde wachtwoord op onder de key 'PASSWORD'
          echo "PASSWORD=$ENCODED_PASSWORD" >> $GITHUB_OUTPUT

      - name: Setup SSH Tunnel to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # AANPASSING: We sturen poort 54322 door naar de INTERNE Docker-containernaam 'supabase-db'
          # Als jouw container in Coolify anders heet (bijv. 'db'), vervang dan 'supabase-db' hieronder.
          ssh -o StrictHostKeyChecking=no -f -N -L 54322:supabase-db:5432 admin@${{ secrets.VPS_IP }}

      - name: Run Supabase Migrations
        run: |
          # We voegen ook --debug toe om de exacte PostgreSQL foutcode te zien mocht dit alsnog misgaan
          supabase db push --debug --db-url "postgresql://postgres:${{ steps.encode_pwd.outputs.PASSWORD }}@127.0.0.1:54322/postgres?sslmode=disable"
