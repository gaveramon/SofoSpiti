name: Greenfield Supabase Migration

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup SSH Tunnel to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # We voegen -4 toe om IPv4 te forceren en tunnelen naar localhost (Docker-vriendelijk)
          ssh -4 -o StrictHostKeyChecking=no -f -N -L 54322:localhost:5432 admin@${{ secrets.VPS_IP }}

      - name: Run Supabase Migrations
        run: |
          # We voegen --debug toe om bij een eventuele fout de exacte PostgreSQL-foutcode te zien
          supabase db push --debug --db-url "postgresql://postgres:${{ secrets.NEW_DB_PASSWORD }}@127.0.0.1:54322/postgres"

