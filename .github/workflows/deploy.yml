name: Greenfield Supabase Migration

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Maak het wachtwoord URL-veilig met quote_plus
      - name: Encode Database Password
        id: encode_pwd
        run: |
          ENCODED_PASSWORD=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote_plus(sys.stdin.read().strip()))" << 'EOF'
          ${{ secrets.NEW_DB_PASSWORD }}
          EOF
          )
          echo "PASSWORD=$ENCODED_PASSWORD" >> $GITHUB_OUTPUT

      - name: Setup SSH Tunnel to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # Installeer socat alléén op de GitHub runner (niet op je VPS)
          sudo apt-get update && sudo apt-get install -y socat
          
          # We gebruiken 'nc' (Netcat) IN de container. Dit gebruikt GEEN poort-forwarding van de firewall.
          socat TCP-LISTEN:54322,fork,reuseaddr EXEC:"ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 admin@${{ secrets.VPS_IP }} docker exec -i db-gbzn02wrcuunfjli9jsqmt9o nc 127.0.0.1 5432",nofork &
          
          sleep 3

      - name: Run Supabase Migrations
        run: |
          # De CLI verbindt nu lokaal, en socat stuurt het als pure SSH-tekst naar de container
          supabase db push --db-url "postgresql://postgres:${{ steps.encode_pwd.outputs.PASSWORD }}@127.0.0.1:54322/postgres?sslmode=disable"
