name: Greenfield Supabase Migration

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup SSH Tunnel to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # Open de tunnel met de nieuwe, wachtwoordloze sleutel
          ssh -o StrictHostKeyChecking=no -f -N -L 54322:127.0.0.1:5432 admin@${{ secrets.VPS_IP }}

      - name: Run Supabase Migrations
        run: |
          # Voer de migraties uit over de werkende tunnel
          supabase db push --db-url "postgresql://postgres:${{ secrets.NEW_DB_PASSWORD }}@127.0.0.1:54322/postgres"
